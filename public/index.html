<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single STK Push - OptimaPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern CSS Reset & Variables */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container & Layout Alignment */
        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header Alignment */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Status Badge Alignment */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--success-bg);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Card System */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: -12px;
        }

        /* Professional Form Alignment */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Inputs & Alignment Wrappers */
        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Amount Prefix Alignment */
        .amount-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.875rem;
            pointer-events: none;
        }

        .amount-input-wrapper input {
            padding-left: 52px; /* Prevent text overlap with prefix */
        }

        /* Button Layout & Alignment */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            flex-grow: 1; /* Stretch action on mobile, aligned nicely */
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: var(--background);
            color: var(--text-main);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: var(--background);
            border-color: var(--border);
        }

        /* Transaction List Styling */
        .empty-message {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px 0;
        }

        /* Footer Alignment */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <span class="logo-icon">💳</span>
                <h1>Single STK Push</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span>Ready</span>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
                <div>
                    <h2>Send Payment Request</h2>
                    <p class="subtitle" style="margin-top: 6px;">Enter the phone number and payment details to trigger an STK Push prompt on the user's phone</p>
                </div>

                <form id="paymentForm">
                    <div class="form-group">
                        <label for="phoneNumber">
                            Phone Number
                            <span class="hint">Format: 254712345678</span>
                        </label>
                        <input 
                            type="text" 
                            id="phoneNumber" 
                            placeholder="e.g., 254712345678" 
                            required
                        />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (KES)</label>
                            <div class="amount-input-wrapper">
                                <span class="currency-symbol">KES</span>
                                <input 
                                    type="number" 
                                    id="amount" 
                                    placeholder="Enter amount" 
                                    min="1" 
                                    step="0.01"
                                    required
                                />
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="reference">Reference (Optional)</label>
                            <input 
                                type="text" 
                                id="reference" 
                                placeholder="e.g., INV_001"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input 
                            type="text" 
                            id="description" 
                            placeholder="e.g., Payment for goods"
                        />
                    </div>

                    <div class="form-actions">
                        <button type="reset" id="resetBtn" class="btn btn-secondary">
                            Clear All
                        </button>
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            <span class="btn-icon">🚀</span>
                            Send Payment Request
                        </button>
                    </div>
                </form>
            </div>

            <div id="resultsSection" class="card results-card" style="display: none;">
                <h2>Payment Results</h2>
                <div id="resultsContent"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Recent Transactions</h2>
                    <button id="refreshTxBtn" class="btn btn-small">
                        🔄 Refresh
                    </button>
                </div>
                <div id="transactionsList">
                    <p class="empty-message">No transactions processed yet</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Single STK Push App | Built with OptimaPay API</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
                    </html>
