<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple M-PESA Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Minimalist Safaricom & M-PESA Theme */
        :root {
            --mpesa-green: #00A859;
            --mpesa-green-dark: #008f4c;
            --mpesa-red: #E21818;
            --bg-color: #F4F6F8;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Centered Compact Layout */
        .payment-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        /* Safaricom Brand Top Header Line */
        .brand-header {
            background: linear-gradient(90deg, var(--mpesa-green) 75%, var(--mpesa-red) 75%);
            height: 5px;
        }

        .card-content {
            padding: 32px 28px;
        }

        /* Branding Logo Header */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .mpesa-tag {
            background-color: var(--mpesa-red);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .portal-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Clean Headings */
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* Form Controls */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
            color: var(--text-dark);
            background-color: #FAFAFA;
        }

        input::placeholder {
            color: #94A3B8;
        }

        input:focus {
            background-color: #FFFFFF;
            border-color: var(--mpesa-green);
            box-shadow: 0 0 0 3px rgba(0, 168, 89, 0.15);
        }

        .currency-prefix {
            position: absolute;
            left: 14px;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--mpesa-green);
            pointer-events: none;
        }

        .amount-input input {
            padding-left: 54px;
            font-weight: 600;
        }

        /* Main Payment Button */
        .pay-button {
            background-color: var(--mpesa-green);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .pay-button:hover {
            background-color: var(--mpesa-green-dark);
        }

        /* Simple Help Info */
        .info-note {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        /* Simple Footer */
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div style="width: 100%; max-width: 420px;">
        <div class="payment-card">
            <div class="brand-header"></div>
            
            <div class="card-content">
                <!-- Branding Header -->
                <div class="logo-box">
                    <span class="mpesa-tag">M-PESA</span>
                    <span class="portal-title">Express Pay</span>
                </div>

                <h1>Pay with M-PESA</h1>
                <p class="subtitle">Enter your phone number below to receive an M-PESA prompt on your phone.</p>

                <!-- Clean Payment Form -->
                <form id="paymentForm">
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phoneNumber" 
                            placeholder="0712345678 or 254712345678" 
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (KES)</label>
                        <div class="input-box amount-input">
                            <span class="currency-prefix">KES</span>
                            <input 
                                type="number" 
                                id="amount" 
                                placeholder="0.00" 
                                min="1" 
                                step="0.01"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reference">Account Ref <span style="font-weight: 400; color: var(--text-muted);">(Optional)</span></label>
                        <input 
                            type="text" 
                            id="reference" 
                            placeholder="e.g. Account or Invoice No."
                        />
                    </div>

                    <button type="submit" id="submitBtn" class="pay-button">
                        <span>Send Payment Prompt</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <!-- Simple Tip -->
                <div class="info-note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Keep your phone unlocked to enter your M-PESA PIN immediately.</span>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Online Payment System | Secured by Safaricom M-PESA</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
